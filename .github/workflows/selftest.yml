name: selftest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline self-test (compile, spec translation, company registry, loader)
        run: python3 skills/sigma-company-dashboard-v2/scripts/selftest.py
